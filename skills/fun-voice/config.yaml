# Configuration for the `fun-voice` skill.
# Holds the values an adopter would change, stated once. Every value is usable
# as shipped, so there is nothing to fill in before first use.

# Spelling variant the rewrite is written in. The persona changes the voice,
# never the spelling standard, so a pirate still writes "colour" in en-AU.
locale: "en-AU"

# Longest the rewrite may run, as a multiple of the original's word count.
# Personas pad easily, and a 3-line update that comes back as 12 stops being
# read. Raise it where the reader wants the full performance.
max_length_ratio: 1.5

# One entry per persona. The prose for each (vibe, anchors, traits, avoid)
# lives in references/personas.md under a heading with the same key. To add
# one, add a key here with the same 4 fields and a section in that file.
#
# kind: "persona" is full roleplay. "preset" is a lighter tone dial, for when
# full roleplay is too heavy for the content or the channel.
#
# aliases are the phrases that pick this persona without asking. Match them
# case-insensitively as whole phrases inside the request.
#
# best_for is what the auto-pick matches the content against when the request
# names no persona.
personas:
  movie-trailer:
    label: "Movie trailer voice"
    kind: "persona"
    aliases: ["movie trailer", "trailer voice", "in a world"]
    best_for: ["status updates", "product launches", "project milestones"]
  noir-detective:
