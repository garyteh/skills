# Cases for skill-author. Authored, not generated.
# Behaviour cases check what it does once fired; trigger cases check when it fires.

cases:
  - query: "write me a skill for querying our deployment API"
    kind: trigger
    expect_fires: true

  - query: "this SKILL.md has allowed-tools in the frontmatter, is that ok?"
    kind: trigger
    expect_fires: true

  - query: "my SKILL.md is 900 lines, should I split it?"
    kind: trigger
    expect_fires: true

  # Near-miss: shares "skill" vocabulary but asks to run one, not author one.
  - query: "use the ast-grep skill to find every call to fetchUser"
    kind: trigger
    expect_fires: false

  # Near-miss: authoring, but prose rather than an agent skill.
  - query: "help me write onboarding documentation for the team"
    kind: trigger
    expect_fires: false

  - query: "create a skill called deploy-checker that verifies a service is healthy after deploy"
    kind: behaviour
    expect_contains:
      - "name: deploy-checker"
      - "description:"
    expect_absent:
      - "allowed-tools"
      - "compatibility:"
    expect:
      - "the description states concrete trigger phrases, not just what the skill does"
      - "the description does not summarise the internal steps"
      - "it locates the target repository by finding AGENTS.md rather than assuming a path"

  - query: "turn this shell one-liner into a skill: curl -s $URL | jq .status"
    kind: behaviour
    expect:
      - "it questions whether this should be a skill at all rather than a script or a prompt"
      - "if it proceeds, it justifies the judgement the skill adds beyond running the command"

  - query: "review skills/foo/SKILL.md for portability"
    kind: behaviour
    expect_absent:
      - "the Grep tool"
      - "the Read tool"
    expect:
      - "it checks for host-specific tool names in the prose"
      - "it runs or names the validator rather than only reading the file"

  # The two-keys rule has one carve-out, and the failure it guards is silent:
  # the skill still loads, so nothing looks broken until an install lists it.
  - query: "this SKILL.md under .agents/skills/ has metadata.internal in the frontmatter, clean it up"
    kind: behaviour
    expect_absent:
      - "removed the metadata key"
    expect:
      - "it keeps metadata.internal: true rather than stripping it"
      - "it says the marker is what keeps a harness skill out of an install's listing"
      - "it reads the repository's AGENTS.md to confirm which tree the file is in"

  - query: "skills/foo and .agents/skills/foo have drifted, sync them"
    kind: behaviour
    expect:
      - "it does not copy one tree over the other"
      - "it asks which tree the skill belongs in, since a skill lives in one or the other"

  # Asking: take what the prompt and session give, then ask once for the rest.
  - query: "create a skill called release-notes in skills/ that drafts release notes from pull requests merged since the last git tag, grouped by label. It should fire on 'write release notes' and 'draft the changelog'."
    kind: behaviour
    expect_contains:
      - "name: release-notes"
    expect:
      - "it asks the user nothing, because the prompt gives the name, tree, purpose and trigger phrases"
      - "it writes skills/release-notes/SKILL.md without first confirming the name or the tree"

  - query: "write me a new skill for this repo"
    kind: behaviour
    expect:
      - "it puts every question it still needs into a single turn, not one per step"
      - "the tree question offers skills/ and .agents/skills/ as options, plus a free-text choice"
      - "it asks nothing the repository already answers, such as where AGENTS.md is"

  - query: "write a skill that drafts a status update for a stakeholder; it needs to know the audience and the date range"
    kind: behaviour
    expect:
      - "the skill it writes takes the audience and the date range from the prompt or session context before asking for either"
      - "the skill it writes asks for whatever is still missing in a single turn"
      - "where the skill it writes asks, it offers options such as audiences from config, plus a free-text answer"

  # The menu rule covers the skill's own decisions, so offering options is not a breach.
  - query: "this skill offers 4 audience options when it asks the user, doesn't that break 'one default per decision, never a menu'?"
    kind: behaviour
    expect:
      - "it says the menu rule covers what the skill decides for itself, not the options it offers the user when it asks"
      - "it keeps the options rather than cutting them to one"
