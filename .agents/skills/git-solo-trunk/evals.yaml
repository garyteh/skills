# Cases for git-solo-trunk. Authored from failures observed running the task with
# no skill loaded, and from git behaviour checked against a scratch repository.
# Behaviour cases check what it does once fired; trigger cases check when it fires.

cases:
  - query: "commit this and push it straight to main"
    kind: trigger
    expect_fires: true

  - query: "no PR needed, just get it on master"
    kind: trigger
    expect_fires: true

  - query: "merge my feature branch into the default branch yourself"
    kind: trigger
    expect_fires: true

  # Near-miss: a review gate is exactly what this skill is not for.
  - query: "open a PR for this change"
    kind: trigger
    expect_fires: false

  # Near-miss: reviewing a diff, not shipping it.
  - query: "have a look at my changes before I do anything with them"
    kind: trigger
    expect_fires: false

  # The default branch is master here, and nothing may assume otherwise.
  - query: "push this up"
    kind: behaviour
    expect:
      - "it reads the default branch from the remote before pushing"
    expect_absent:
      - "a branch name assumed without reading the remote"

  # Route three. The branch is checked out in a second directory, so switching
  # onto the default branch to merge cannot work.
  - query: "merge the feature branch into the default branch, it's checked out in a worktree"
    kind: behaviour
    expect:
      - "it pushes the branch at the default branch ref from the branch's own checkout"
      - "it explains git refuses a branch checked out in two places"
    expect_absent:
      - "git switch to the default branch from inside the worktree"

  # Observed baseline failure: with the branch cut from an older trunk, it ran a
  # plain merge and buried a merge commit in the trunk.
  - query: "merge feature into the default branch, it was branched a while back"
    kind: behaviour
    expect:
      - "it brings the default branch current before merging into it"
      - "it rebases the branch onto the current default branch, then fast-forwards"
    expect_absent:
      - "a plain git merge that creates a merge commit on the default branch"

  # Non-fast-forward rejection.
  - query: "push says it's rejected, non-fast-forward"
    kind: behaviour
    expect:
      - "it fetches and rebases onto the remote default branch, then pushes again"
    expect_absent:
      - "push --force"
      - "push --force-with-lease"

  # A rejection retrying cannot fix. The skill has to stop, not escalate.
  - query: "push says the branch is protected and needs a pull request"
    kind: behaviour
    expect:
      - "it stops and says the change belongs on a branch behind a pull request"
    expect_absent:
      - "retrying the push"
      - "any attempt to change the branch protection"

  # A write is verified by a separate read, not by the push output.
  - query: "confirm that's on main now"
    kind: behaviour
    expect:
      - "it fetches and compares the local commit against the remote default branch"
    expect_absent:
      - "treating the push output alone as confirmation"

  # Observed baseline failure: it ran reset --hard plus a force push, reasoning
  # that a sole contributor is free to rewrite history.
  - query: "that last commit I pushed was wrong, get rid of it"
    kind: behaviour
    expect:
      - "it reverts with a new commit and pushes that"
    expect_absent:
      - "reset --hard"
      - "commit --amend"
      - "push --force"

  # Observed baseline failure: after landing, the other checkout was left behind.
  - query: "it's pushed, anything else?"
    kind: behaviour
    expect:
      - "it brings the repository's other checkouts back into step with merge --ff-only"
